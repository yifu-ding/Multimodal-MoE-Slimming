dataset_path: lmms-lab/GQA
dataset_name: testdev_balanced_instructions
dataset_kwargs:
  token: true
task: gqa_decode
test_split: testdev
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.gqa.utils.gqa_doc_to_visual
doc_to_text: !function lmms_eval.tasks.gqa.utils.gqa_doc_to_text
doc_to_target: answer
process_docs: !function lmms_eval.tasks.gqa.utils.gqa_process_docs
generation_kwargs:
  # Forces a fixed decode length (min_new_tokens + ignore_eos) so batches
  # exercise steady-state decode instead of stopping at GQA's usual 1-3 token
  # short-phrase answers. Requires the MAES lmms-eval vLLM decode-sampling
  # patch (patches/lmms_eval_vllm_decode_sampling_kwargs.patch).
  max_new_tokens: 128
  min_new_tokens: 128
  ignore_eos: true
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  - version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
  qwen_vl:
    pre_prompt: ""
    post_prompt: " Answer:"
