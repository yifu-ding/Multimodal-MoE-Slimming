    test: /home/data/dyf/hf_cache/datasets/egoschema/Subset/test-00000-of-00001.parquet
task: egoschema_subset_local
task_alias: egoschema_subset
test_split: test
output_type: generate_until
doc_to_visual: !function egoschema_subset_local_utils.egoschema_local_doc_to_visual
